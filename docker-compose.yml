services:
  platform-mock:
    build: ./platform-mock
    container_name: daily-pass-mock
    ports:
      - "9100:9100"
    environment:
      - APP_ID=${APP_ID:-APP_000123}
      - APP_PASSWORD=${APP_PASSWORD:-demo-password}
      - SERVICE_URL=http://service:8080
      - PHP_CLI_SERVER_WORKERS=4
    volumes:
      - ./data/mock:/app/data
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string)@file_get_contents('http://127.0.0.1:9100/health'), 'platform-mock') ? 0 : 1);"]
      interval: 4s
      timeout: 3s
      retries: 10

  service:
    build: ./service
    container_name: daily-pass-service
    ports:
      - "8080:8080"
    depends_on:
      platform-mock:
        condition: service_healthy
    environment:
      - PORT=8080
      - PLATFORM_URL=http://platform-mock:9100
      - APP_ID=${APP_ID:-APP_000123}
      - APP_PASSWORD=${APP_PASSWORD:-demo-password}
      - DAILY_AMOUNT=${DAILY_AMOUNT:-5.00}
      - DAILY_CURRENCY=${DAILY_CURRENCY:-XTS}
      - SMS_SHORTCODE=${SMS_SHORTCODE:-3030}
      - BILLING_TZ=${BILLING_TZ:-UTC}
      - GRACE_RETRY_INTERVALS_SEC=${GRACE_RETRY_INTERVALS_SEC:-120,300,600}
      - THROTTLE_RETRY_SEC=${THROTTLE_RETRY_SEC:-1}
      - JOB_INTERVAL_MINUTES=${JOB_INTERVAL_MINUTES:-0}
      - MSISDN_STRICT=${MSISDN_STRICT:-true}
      - PHP_CLI_SERVER_WORKERS=4
    volumes:
      - ./data/service:/app/data
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string)@file_get_contents('http://127.0.0.1:8080/health'), 'daily-pass') ? 0 : 1);"]
      interval: 4s
      timeout: 3s
      retries: 10
