; Runtime error policy for the container.
;
; php:8.2-cli ships no php.ini, so display_errors defaults to STDOUT — and for
; `php -S` STDOUT is the HTTP response body. A single warning would then leak
; absolute paths to the client and break the status code (headers already sent).
display_errors = Off
html_errors = Off
log_errors = On
error_log = /proc/self/fd/2
